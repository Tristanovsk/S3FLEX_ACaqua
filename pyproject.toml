# pyproject.toml
[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s3flex_acaqua"
version = "0.0.2"
description = "Prototype code to perform atmospheric correction of FLEX above water"
readme = "pypi_README.rst"
authors = [{ name = "Tristan Harmel", email = "tristan.harmel@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["Sentinel-2","Landsat-8","Landsat-9", "EO satellite"]
requires-python = ">=3.9"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"s3flex_acaqua"= ['*.yml',
                 'data/lut/gases/*.nc',
                 'data/lut/atmo/*.nc',
                 'data/auxdata/*']

[tool.setuptools.exclude-package-data]
"*" = [".gitattributes"]

[project.scripts]
s3flex_acaqua = "s3flex_acaqua.run:main"

#dynamic = ["dependencies"]
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.optional-dependencies]
dev = ["black", "bumpver", "isort", "pip-tools", "pytest"]

[project.urls]
Homepage = "https://github.com/Tristanovsk/"
Documentation = "https://radcalnet-oc.readthedocs.io"